# Dependabot PR 向けの自動マージ例。依存更新は Renovate に統一したため、本リポジトリでは参照用のデモとして残している
name: Auto merge
on: pull_request
permissions: {}
jobs:
  merge:
    if: ${{ github.actor == 'dependabot[bot]' }}      # DependabotのPRのみ
    runs-on: ubuntu-latest
    permissions:                                      # マージに必要なパーミッション
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # Github CLIのクレデンシャル
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |                                        # Github CLIで承認とマージ 
          gh pr review "${GITHUB_HEAD_REF}" --approve
          gh pr merge "${GITHUB_HEAD_REF}" --merge --auto
