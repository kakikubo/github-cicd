name: Test
on:
  pull_request:
    paths: ['go/**/*.go']
permissions: {}
jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: .go-version
      - run: go test go/excellent/*.go
