name: Modified Cross repo
on: push
permissions: {}
env:
  TARGET_REPO: github-terraform
jobs:
  # job-level if では secrets コンテキストが使えないため、先行ジョブで有無を判定する
  check-secrets:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    outputs:
      has_app_id: ${{ steps.check.outputs.has_app_id }}
    steps:
      - id: check
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [ -n "${APP_ID}" ]; then
            echo "has_app_id=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_app_id=false" >> "${GITHUB_OUTPUT}"
          fi
  checkout:
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.has_app_id == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7                  # スクリプト実行にはチェックアウトが必要
      - id: create
        run: .github/scripts/token.sh              # Github Appsトークン生成スクリプトの実行
        env:                                       # App IDや秘密鍵は環境変数で渡す事に注意
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/${{ env.TARGET_REPO }}
          path: ${{ env.TARGET_REPO }}
          token: ${{ steps.create.outputs.token }}
      - run: cat "${TARGET_REPO}/README.md"
      - run: |                                               # 即時失効APIの実行
          curl --location --silent --request DELETE \
            --url "${GITHUB_API_URL}/installation/token" \
            --header "Accept: application/vnd.github+json" \
            --header "X-Github-Api-Version: 2022-11-28" \
            --header "Authorization: Bearer ${TOKEN}"
        env:
          TOKEN: ${{ steps.create.outputs.token }}
