name: Cross repo
on: push
permissions: {}
env:
  TARGET_REPO: github-terraform
jobs:
  # job-level if では secrets コンテキストが使えないため、先行ジョブで有無を判定する
  check-secrets:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    outputs:
      has_app_id: ${{ steps.check.outputs.has_app_id }}
    steps:
      - id: check
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [ -n "${APP_ID}" ]; then
            echo "has_app_id=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_app_id=false" >> "${GITHUB_OUTPUT}"
          fi
  checkout:
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.has_app_id == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - id: create
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          repositories: ${{ env.TARGET_REPO }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/${{ env.TARGET_REPO }}
          path: ${{ env.TARGET_REPO }}
          token: ${{ steps.create.outputs.token }}
      - run: cat "${TARGET_REPO}/README.md"
