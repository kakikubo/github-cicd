name: Dump
on: workflow_dispatch
permissions: {}
jobs:
  debug:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1     # ローカルアクション呼び出し前にチェックアウト
      - uses: $/.github/actions/dump/ # ローカルアクションの呼び出し（$/ はワークフローと同じコミットを指す）
        id: dump
        with:
          enable-context: 'true'      # 入力パラメータの指定
      - run: echo "${DATE}"
        env:
          DATE: ${{ steps.dump.outputs.dumped-date }} # アクションの出力値を参照
