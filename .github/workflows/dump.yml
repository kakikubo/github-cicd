name: Dump
on: workflow_dispatch
permissions: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7     # ローカルアクション呼び出し前にチェックアウト
      - uses: ./.github/actions/dump/ # ローカルアクションの呼び出し
        id: dump
        with:
          enable-context: 'true'      # 入力パラメータの指定
      - run: echo "${DATE}"
        env:
          DATE: ${{ steps.dump.outputs.dumped-date }} # アクションの出力値を参照
