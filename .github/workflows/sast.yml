name: Static Application Security Testing (SAST)
on: pull_request
permissions: {}
jobs:
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.x'
  #     - run: pip install bandit # Banditのインストール
  #     - run: bandit -r .        # BanditでPythonのコードスキャン
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7.0.1
      # securego/gosec は公式推奨の @master 参照を使い、実行されるコミットは actions.lock で固定する
      # （更新は gh actions-lock --relock）。リポジトリ設定の許可アクションは securego/gosec@* にしておく。
      # @master のみの許可だと、SHA で解決されたときに startup_failure になる。
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
