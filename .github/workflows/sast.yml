name: Static Application Security Testing (SAST)
on: pull_request
permissions: {}
jobs:
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.x'
  #     - run: pip install bandit # Banditのインストール
  #     - run: bandit -r .        # BanditでPythonのコードスキャン
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # securego/gosec は公式が @master 参照を推奨。コミット SHA ピンだと
      # ジョブ未作成の startup_failure（workflow file issue）になるため master を使う。
      # イミュータブル固定は #412（actions.lock）導入時に再検討する。
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
