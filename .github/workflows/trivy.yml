name: Container image scan
on: pull_request
permissions: {}
jobs:
  scan:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nginx:1.27.4
          severity: CRITICAL,HIGH
          exit-code: 0 # 異常終了コードを許容する
          format: table
