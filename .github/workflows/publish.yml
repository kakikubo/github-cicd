# Usage: gh workflow run publish.yml -f version=0.1.0
name: Publish
on:
  workflow_dispatch:
    inputs:
      version:                             # ワークフロー起動時に指定するバージョン
        type: string
        required: true
        description: "バージョン(例: 1.2.3)"
env:
  IMAGE_NAME: gha-image                    # コンテナイメージ名
permissions: {}
jobs:
  publish:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:                           # Github Packagesへの書き込みを許可
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.8.0       # コンテナレジストリへのログイン
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0    # コンテナイメージのメタデータ生成
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0  # コンテナイメージのビルドとプッシュ
        with:
          push: true
          context: docker/example/
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
