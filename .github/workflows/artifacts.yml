name: Artifacts
on: workflow_dispatch
permissions: {}
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: date > date.txt              # アーティファクトの生成
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7  # アーティファクトのアップロード
        with:
          name: uploaded                  # アーティファクト名
          path: date.txt                  # アーティファクト対象のパス
          retention-days: 7               # アーティファクトの保存期間
  download:
    runs-on: ubuntu-latest
    needs: [upload]                       # uploadジョブの実行を待つ
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 # アーティファクトのダウンロード
        with:
          name: uploaded                  # アーティファクト名
          path: downloaded                # ダウンロード先のパス
      - run: cat downloaded/date.txt      # アーティファクトを標準出力
